name: Ethereum Lab Unit Tests
on:
  push:
    branches: [eth-lab]
    paths:
      - 'eth-lab/**'
      - '.github/workflows/eth-lab-ci.yml'
  workflow_dispatch:
jobs:
  five_card_schema:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eth-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and unit checks
        run: npm test
