name: Import the original ARCY greeting animation (one-time)
on:
  push:
    branches: [feature/three-chain-release-lab-20261011]
    paths:
      - '.github/workflows/import-arcy-greeting-once.yml'
permissions:
  contents: write
jobs:
  copy_approved_public_video:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          ref: feature/three-chain-release-lab-20261011
      - name: Copy canonical greeting video from old website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p eth-lab/assets
          curl --fail --location --retry 3 --max-time 60 \
            'https://raw.githubusercontent.com/arcycoin-glitch/arcy-website/main/assets/1000266146.mp4' \
            --output eth-lab/assets/arcy-greeting.mp4
          python3 - <<'PY'
          from pathlib import Path
          f=Path('eth-lab/assets/arcy-greeting.mp4')
          b=f.read_bytes()
          assert 200000 < len(b) < 5000000, 'Unexpected greeting video size'
          assert b[4:8] == b'ftyp', 'Not an MP4 video'
          print('Original ARCY greeting MP4 validated:',len(b),'bytes')
          PY
      - name: Commit original animation to test branch only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eth-lab/assets/arcy-greeting.mp4
          if git diff --cached --quiet; then
            echo 'Video already checked in.'
          else
            git commit -m 'Preserve original ARCY greeting animation in new test project'
            git push origin HEAD:refs/heads/feature/three-chain-release-lab-20261011
          fi
