name: Import canonical ARCY owl from original project (one-time)
on:
  push:
    branches: [feature/three-chain-release-lab-20261011]
    paths:
      - '.github/workflows/import-official-owl-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          ref: feature/three-chain-release-lab-20261011
      - name: Copy original published owl asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p eth-lab/assets
          curl --fail --location --retry 3 --max-time 45 \
            "https://raw.githubusercontent.com/arcycoin-glitch/arcy-website/main/assets/hero-arcy.png" \
            --output eth-lab/assets/hero-arcy.png
          python3 - <<'PY'
          from pathlib import Path
          f=Path('eth-lab/assets/hero-arcy.png')
          data=f.read_bytes()
          assert data[:8]==b'\x89PNG\r\n\x1a\n', 'Expected genuine PNG asset'
          assert 10000<len(data)<5000000, 'Unexpected file size'
          print('Verified canonical ARCY PNG:',len(data),'bytes')
          PY
      - name: Commit mascot asset into test branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eth-lab/assets/hero-arcy.png
          if git diff --cached --quiet; then
            echo 'Canonical owl asset already committed.'
          else
            git commit -m "Include official ARCY owl mascot from original project"
            git push origin HEAD:refs/heads/feature/three-chain-release-lab-20261011
          fi
