name: Three-chain source-backed card coverage
on:
  push:
    branches: [feature/three-chain-release-lab-20261011]
    paths:
      - 'eth-lab/scripts/live-card-coverage.cjs'
      - '.github/workflows/live-card-coverage.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    defaults:
      run:
        working-directory: eth-lab
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Validate exact-chain five-card provenance and coverage
        run: node scripts/live-card-coverage.cjs
