name: Three-chain logo discovery and Arc count mainnet
on:
  push:
    branches: [feature/three-chain-release-lab-20261011]
    paths:
      - 'eth-lab/scripts/live-discovery.cjs'
      - '.github/workflows/live-discovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: eth-lab
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Exact-chain three-network token search and image validation
        run: node scripts/live-discovery.cjs
