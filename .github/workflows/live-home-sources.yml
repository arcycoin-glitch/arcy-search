name: ARCY Pulse and Unlock official live source acceptance
on:
  push:
    branches: [feature/three-chain-release-lab-20261011]
    paths:
      - 'eth-lab/scripts/live-home.cjs'
      - '.github/workflows/live-home-sources.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: eth-lab
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Audit real source-backed weekly news and unlock records
        run: node scripts/live-home.cjs
