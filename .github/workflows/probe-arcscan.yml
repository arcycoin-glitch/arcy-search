name: Probe public Arcscan token concentration API (read only)
on:
  push:
    branches: [feature/three-chain-release-lab-20261011]
    paths:
      - '.github/workflows/probe-arcscan.yml'
      - 'eth-lab/scripts/probe-arcscan.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    defaults:
      run:
        working-directory: eth-lab
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Probe public source metadata for schema only
        run: node scripts/probe-arcscan.cjs
