name: Ethereum and Robinhood mainnet acceptance (read only)
on:
  push:
    branches: [feature/three-chain-release-lab-20261011]
    paths:
      - '.github/workflows/three-chain-other-mainnets.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ethereum:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: eth-lab
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Ethereum mainnet six-token and negative tests
        run: npm run smoke
  robinhood:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: eth-lab
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Robinhood mainnet official contract and security checks
        run: npm run smoke:robinhood
