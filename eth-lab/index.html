<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ARCY SEARCH — Ethereum Lab</title><style>body{background:#050e19;color:#edf7ff;font:16px system-ui;margin:0}main{max-width:760px;margin:65px auto;padding:20px}h1{color:#33d6ff}input{width:72%;background:#0e2235;border:1px solid #24617d;border-radius:8px;padding:14px;color:white}button{background:#25c9ef;border:0;border-radius:8px;padding:14px;cursor:pointer}pre{background:#0e2235;padding:20px;overflow:auto;white-space:pre-wrap;word-break:break-word;border-radius:12px}p{color:#a9bbc9}</style></head><body><main><h1>ARCY SEARCH — ETH LAB</h1><p>Read-only Ethereum mainnet experiment. No wallet, trading, or production integration.</p><input id="addr" aria-label="Ethereum token contract" value="0xA0b86991c6218b36c1d19d4a2e9eb0ce3606eb48"><button id="scan">Scan</button><pre id="result">Choose a contract and scan. Unsupported fields will remain NOT VERIFIED.</pre><script>const button=document.getElementById('scan');button.addEventListener('click',async()=>{button.disabled=true;document.getElementById('result').textContent='Scanning Ethereum...';try{const r=await fetch('/api/token?address='+encodeURIComponent(document.getElementById('addr').value.trim()));document.getElementById('result').textContent=JSON.stringify(await r.json(),null,2)}catch(e){document.getElementById('result').textContent='Network request failed'}finally{button.disabled=false}})</script></main></body></html>
